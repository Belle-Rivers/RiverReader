services:
  - type: web
    name: river-reader-api
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt && pip install -e .
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RIVER_READER_DATABASE_URL
        sync: false
      - key: RIVER_READER_AI_ENABLED
        value: "false"
      - key: RIVER_READER_GROQ_API_KEY
        sync: false

  - type: web
    name: river-reader-frontend
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: RIVER_READER_API_URL
        sync: false
